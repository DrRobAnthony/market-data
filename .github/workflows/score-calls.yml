name: Score channel calls
on:
  push:
    paths: ["data/external/prof_calls.json", "score_calls.py"]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: score-calls
  cancel-in-progress: false
env:
  CRYPTOCOMPARE_API_KEY: ${{ secrets.CRYPTOCOMPARE_API_KEY }}
jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python score_calls.py
      - name: Commit results
        run: |
          git config user.name "data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/external/prof_scored.json
          git diff --cached --quiet && exit 0
          git commit -m "Score channel calls"
          git pull --rebase -q origin main
          git push
